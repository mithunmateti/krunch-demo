<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Krunch Feedback</title>
  <meta name="theme-color" content="#060606">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    main { max-width: 520px; margin: 0 auto; padding: 28px 16px 60px; min-height: calc(100svh - 61px); display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: clamp(40px, 11vw, 56px); line-height: .95; letter-spacing: -0.05em; font-weight: 500; margin: 16px 0 10px; text-align: center; }
    .center { text-align: center; }
    .step { animation: in .7s var(--ease) both; }
    @keyframes in { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }
    .rating-label { height: 22px; margin: 10px 0 24px; color: var(--muted); font-size: 15px; text-align: center; transition: color .3s; }
    .more { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .7s var(--ease), opacity .5s ease; }
    .more.open { max-height: 900px; opacity: 1; }
    .thanks-icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
    .thanks-icon svg { width: 34px; height: 34px; }
    .google-btn { background: #fff; color: #111; border-color: #fff; }
    .google-btn:hover { background: #f1f1f1; }
    .callout { padding: 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 14px; color: rgba(255,255,255,.8); margin: 20px 0; text-align: left; }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <header class="appbar">
    <a href="index.html" class="brand"><span class="brand-logo">K</span><span class="brand-name">Krunch <small>Fitness</small></span></a>
    <span class="demo-flag">Desk QR · Demo</span>
  </header>

  <main>
    <!-- Step 1 -->
    <section class="step" id="s1">
      <div class="center"><span class="kicker"><span class="dot"></span> 10-second check-in</span></div>
      <h1>How was today's <span class="serif">workout?</span></h1>
      <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>
      <p class="rating-label" id="rating-label">Tap a star</p>

      <div class="more" id="more">
        <div class="field"><label>What stood out? <span class="faint">(optional)</span></label>
          <div class="choice-row" data-choice data-multi id="tags">
            <span class="choice">Cleanliness</span><span class="choice">Coaches</span><span class="choice">Equipment</span>
            <span class="choice">Crowd</span><span class="choice">Washroom</span><span class="choice">Staff</span><span class="choice">Music</span>
          </div>
        </div>
        <div class="field"><label for="msg">Anything the owner should know? <span class="faint">(optional)</span></label>
          <textarea class="input" id="msg" placeholder="Good or bad, the owner reads every one"></textarea>
        </div>
        <div class="field"><label for="phone">Want a call back? <span class="faint">(optional)</span></label>
          <input class="input" id="phone" inputmode="tel" placeholder="Your mobile number">
        </div>
        <button class="btn btn-light btn-block" id="send">Send feedback</button>
      </div>
    </section>

    <!-- Step 2 -->
    <section class="step hidden center" id="s2">
      <div class="thanks-icon" id="t-icon"></div>
      <h1 id="t-title"></h1>
      <p class="muted" id="t-body" style="margin:0 auto;max-width:380px"></p>
      <div class="callout" id="t-callout"></div>
      <!-- Same review button for every rating. Google's policy forbids only asking happy customers. -->
      <a class="btn google-btn btn-block" id="g-btn" target="_blank" rel="noopener"></a>
      <p class="tiny faint" style="margin:12px 0 26px">Reviews help other people in Saidabad find a good gym.</p>
      <a href="index.html" class="btn btn-sm">Back to Krunch</a>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script>
    const { $, $$, icon, toast, choices, chosen } = UI;
    const labels = ["", "Not good", "Could be better", "It was okay", "Good session", "Loved it"];
    let rating = 0;

    $("#stars").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button class="star-btn" data-n="${n}" role="radio" aria-label="${n} star${n > 1 ? "s" : ""}">${icon.star}</button>`).join("");
    $("#stars").addEventListener("click", (e) => {
      const b = e.target.closest(".star-btn"); if (!b) return;
      rating = +b.dataset.n;
      $$(".star-btn").forEach((s, i) => {
        s.classList.toggle("on", i < rating);
        s.animate([{ transform: "scale(1)" }, { transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: 380, delay: i * 40, easing: "cubic-bezier(.16,1,.3,1)" });
      });
      $("#rating-label").textContent = labels[rating];
      $("#rating-label").style.color = rating >= 4 ? "#ffc93c" : "var(--text)";
      $("#more").classList.add("open");
    });
    choices();

    $("#send").addEventListener("click", () => {
      if (!rating) { toast("Tap a star first"); return; }
      const phone = $("#phone").value.replace(/\D/g, "");
      const fb = Store.addFeedback({ kind: "feedback", rating, tags: chosen($("#tags")), message: $("#msg").value.trim(), phone, name: "" });
      showThanks(fb, phone);
    });

    function showThanks(fb, phone) {
      const happy = rating >= 4;
      $("#t-icon").style.background = happy ? "var(--ok-soft)" : "var(--accent-soft)";
      $("#t-icon").style.color = happy ? "var(--ok)" : "#ff7385";
      $("#t-icon").innerHTML = happy ? icon.star : icon.check;
      $("#t-title").innerHTML = happy ? `Thank you, <span class="serif">truly.</span>` : `Thanks for being <span class="serif">honest.</span>`;
      $("#t-body").textContent = happy
        ? "Glad you had a strong session. The team will be happy to hear it."
        : "This went straight to the owner. We read every note and fix what we can, fast.";
      $("#t-callout").innerHTML = phone
        ? `${icon.phone.replace("<svg", '<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:6px"')} We'll call you on <b>${phone}</b> today.`
        : "Your feedback is private to the owner unless you choose to post a public review below.";
      $("#g-btn").innerHTML = `${icon.google} Review us on Google`;
      $("#g-btn").href = GYM.reviewUrl;
      $("#g-btn").onclick = () => Store.markReviewPrompted(fb.id);
      $("#s1").classList.add("hidden");
      $("#s2").classList.remove("hidden");
      scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
